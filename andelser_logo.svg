<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <!-- Concept A: 'Branching Datum' monogram in Solid White -->
  <line x1="20" y1="6" x2="8" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="6" x2="27.5" y2="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Main leg -->
  <line x1="27.5" y1="23" x2="32" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Radiating branches representing logical/else branching -->
  <line x1="27.5" y1="23" x2="37" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="27.5" y1="23" x2="38" y2="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="27.5" y1="23" x2="35" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Drafting crossbar -->
  <line x1="12.5" y1="23" x2="27.5" y2="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
</svg>
